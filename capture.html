<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oceanic Photobooth</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  font-family: 'Montserrat', sans-serif;

  color: #123f69;

  background-image:
    linear-gradient(
      rgba(255,255,255,0.18),
      rgba(255,255,255,0.18)
    ),
    url('santorini-bg.jpg');

  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  display: flex;
  flex-direction: column;
  align-items: center;

  overflow-x: hidden;
}

/* Top blue line */

body::before {
  content: "";

  position: fixed;

  top: 0;
  left: 0;

  width: 100%;
  height: 8px;

  background: #145a91;

  z-index: 20;
}


/* MAIN CARD */

.main-container {

  width: min(95%, 850px);

  margin: 40px auto 80px;

  padding: 25px 25px 60px;

  background: rgba(255, 253, 246, 0.95);

  border: 3px solid white;

  border-radius: 12px;

  box-shadow:
    0 15px 40px rgba(10, 55, 85, 0.25);

  text-align: center;
}


/* NAVIGATION */

.top-navigation {

  display: flex;

  justify-content: flex-start;

  margin-bottom: 5px;
}

.home-button {

  background: transparent;

  border: none;

  color: #145a91;

  font-family: 'Montserrat', sans-serif;

  font-size: 14px;

  font-weight: 600;

  cursor: pointer;

  transition:
    transform 0.2s ease;
}

.home-button:hover {

  transform:
    translateX(-4px);
}


/* HEADER */

h1 {

  margin: 5px 0;

  color: #145a91;

  font-family:
    'Cormorant Garamond',
    serif;

  font-size:
    clamp(2.5rem, 7vw, 4rem);

  font-weight: 700;
}

.subtitle {

  color: #6c8291;

  font-family:
    'Cormorant Garamond',
    serif;

  font-size: 1.3rem;

  font-style: italic;

  margin-bottom: 10px;
}


/* DECORATIVE WAVE */

.decorative-line {

  width: 200px;

  height: 25px;

  margin: 5px auto 20px;

  background-image:
    url('wave-decoration.png');

  background-size:
    200px auto;

  background-position:
    center;

  background-repeat:
    no-repeat;
}


/* CAMERA */

#camera {

  display: block;

  width: 400px;

  max-width: 100%;

  height: 300px;

  margin: 20px auto;

  object-fit: cover;

  background: #dcecf2;

  border: 7px solid white;

  outline: 2px solid #79aeca;

  border-radius: 8px;

  transform: scaleX(-1);

  box-shadow:
    0 10px 25px
    rgba(10, 55, 85, 0.25);
}


/* COUNTDOWN */

#countdown {

  min-height: 70px;

  margin: 5px;

  color: #145a91;

  font-family:
    'Cormorant Garamond',
    serif;

  font-size: 4.5rem;

  font-weight: 700;

  animation:
    pulse 1s infinite;
}

@keyframes pulse {

  0% {
    transform: scale(1);
    opacity: 1;
  }

  50% {
    transform: scale(1.15);
    opacity: 0.7;
  }

  100% {
    transform: scale(1);
    opacity: 1;
  }

}


/* BUTTONS */

.buttons {

  display: flex;

  justify-content: center;

  flex-wrap: wrap;

  gap: 10px;

  margin: 15px auto 25px;
}

button {

  padding: 13px 25px;

  border-radius: 30px;

  font-family:
    'Montserrat',
    sans-serif;

  font-size: 14px;

  font-weight: 600;

  letter-spacing: 0.5px;

  cursor: pointer;

  transition:
    transform 0.25s ease,
    background 0.25s ease,
    box-shadow 0.25s ease;
}


/* START CAPTURE BUTTON */

.capture-button {

  background: #145a91;

  color: white;

  border:
    2px solid
    #145a91;

  box-shadow:
    0 6px 15px
    rgba(20, 90, 145, 0.25);
}

.capture-button:hover {

  background: #0d456f;

  transform:
    translateY(-3px);
}


/* TAKE PHOTO BUTTON */

.take-photo-button {

  display: none;

  background: #e3a928;

  color: white;

  border:
    2px solid
    #e3a928;

  box-shadow:
    0 6px 15px
    rgba(227, 169, 40, 0.3);
}

.take-photo-button:hover {

  background: #c88e17;

  transform:
    translateY(-3px);
}


/* PHOTO PREVIEW */

.polaroid-wrapper {

  margin-top: 20px;
}

.polaroid-title {

  color: #145a91;

  font-family:
    'Cormorant Garamond',
    serif;

  font-size: 1.7rem;

  font-weight: 700;

  margin-bottom: 15px;
}


/* POLAROID */

.polaroid {

  position: relative;

  width: 320px;

  height: 500px;

  margin: 0 auto;

  background-image:
    url('polaroid.png');

  background-size:
    100% 100%;

  background-position:
    center;

  background-repeat:
    no-repeat;

  filter:
    drop-shadow(
      0 12px 20px
      rgba(10, 55, 85, 0.25)
    );

  transform:
    rotate(-1deg);
}


/* PHOTO SLOTS */

.slot {

  position: absolute;

  width: 260px;

  height: 140px;

  left: 30px;

  overflow: hidden;

  background:
    rgba(245, 250, 250, 0.8);

  border-radius: 3px;
}


/* PHOTO POSITIONS */

#slot0 {
  top: 30px;
}

#slot1 {
  top: 180px;
}

#slot2 {
  top: 330px;
}


/* CAPTURED PHOTO */

.slot canvas {

  display: block;

  width: 100%;

  height: 100%;

  object-fit: cover;

  animation:
    slideIn 0.5s ease-out;
}

@keyframes slideIn {

  from {

    transform:
      translateY(-20px);

    opacity: 0;

  }

  to {

    transform:
      translateY(0);

    opacity: 1;

  }

}


/* INSTRUCTION */

.instruction {

  margin-top: 25px;

  color: #145a91;

  font-family:
    'Cormorant Garamond',
    serif;

  font-size: 1.5rem;

  font-weight: 600;
}


/* ==========================================
   PRINTING SECTION
========================================== */

.print-section {

  display: none;

  margin-top: 35px;

  padding-top: 30px;

  border-top:
    2px dashed
    #a8c9d8;
}


/* PRINT TITLE */

.print-title {

  color: #145a91;

  font-family:
    'Cormorant Garamond',
    serif;

  font-size: 2rem;

  font-weight: 700;

  margin-bottom: 5px;
}

.print-subtitle {

  color: #6c8291;

  font-size: 0.9rem;

  margin-bottom: 25px;
}


/* PRINTER */

.printer {

  position: relative;

  width: 330px;

  height: 220px;

  margin: 30px auto 0;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #edf5f7
    );

  border-radius:
    18px 18px 10px 10px;

  border:
    3px solid
    #c7dfe8;

  box-shadow:
    0 12px 25px
    rgba(10, 55, 85, 0.2);

  overflow: visible;
}


/* PRINTER TOP */

.printer-top {

  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 55px;

  background:
    #145a91;

  border-radius:
    14px 14px 0 0;

  display: flex;

  align-items: center;

  justify-content: center;

  color: white;

  font-family:
    'Cormorant Garamond',
    serif;

  font-size: 1.4rem;

  font-weight: 700;
}


/* PRINTER DETAILS */

.printer-detail {

  position: absolute;

  top: 70px;

  left: 30px;

  width: 270px;

  height: 20px;

  background:
    #dcecf2;

  border-radius: 10px;
}


/* PRINTER LIGHT */

.printer-light {

  position: absolute;

  top: 105px;

  left: 50%;

  transform:
    translateX(-50%);

  width: 12px;

  height: 12px;

  background:
    #e3a928;

  border-radius: 50%;

  box-shadow:
    0 0 12px
    rgba(227, 169, 40, 0.8);

  animation:
    printerLight 1s infinite;
}

@keyframes printerLight {

  0% {
    opacity: 1;
  }

  50% {
    opacity: 0.3;
  }

  100% {
    opacity: 1;
  }

}


/* PAPER SLOT */

.paper-slot {

  position: absolute;

  bottom: 20px;

  left: 35px;

  width: 260px;

  height: 20px;

  background:
    #123f69;

  border-radius:
    4px;

  z-index: 5;
}


/* PRINTING PAPER */

.printed-photo {

  position: absolute;

  z-index: 3;

  width: 230px;

  height: 360px;

  left: 50%;

  transform:
    translateX(-50%);

  bottom: 25px;

  background:
    white;

  box-shadow:
    0 5px 15px
    rgba(10, 55, 85, 0.25);

  opacity: 0;

  overflow: hidden;
}


/* PAPER IMAGE */

.printed-photo img {

  width: 100%;

  height: 100%;

  object-fit: cover;
}


/* PRINTING ANIMATION */

.printer.printing
.printed-photo {

  animation:
    printPhoto
    5s
    ease-out
    forwards;
}

@keyframes printPhoto {

  0% {

    opacity: 1;

    transform:
      translate(
        -50%,
        0
      );

  }

  20% {

    transform:
      translate(
        -50%,
        0
      );

  }

  100% {

    opacity: 1;

    transform:
      translate(
        -50%,
        335px
      );

  }

}


/* PRINTING MESSAGE */

.printing-message {

  margin-top: 25px;

  color: #145a91;

  font-family:
    'Cormorant Garamond',
    serif;

  font-size: 1.5rem;

  font-weight: 700;

  min-height: 35px;
}


/* SAVE BUTTON */

.save-button {

  display: none;

  margin-top: 20px;

  background:
    #145a91;

  color: white;

  border:
    2px solid
    #145a91;

  box-shadow:
    0 6px 15px
    rgba(20, 90, 145, 0.25);
}

.save-button:hover {

  background:
    #0d456f;

  transform:
    translateY(-3px);
}


/* SUCCESS MESSAGE */

.success-message {

  display: none;

  color:
    #145a91;

  font-family:
    'Cormorant Garamond',
    serif;

  font-size:
    1.8rem;

  font-weight:
    700;

  margin-top:
    20px;
}


/* BOTTOM WAVE */

.bottom-wave {

  position: fixed;

  bottom: 0;
  left: 0;

  width: 100%;

  height: 70px;

  background-image:
    url('wave-decoration.png');

  background-size:
    auto 70px;

  background-position:
    center bottom;

  background-repeat:
    repeat-x;

  pointer-events:
    none;
}


/* MOBILE */

@media (max-width: 600px) {

  .main-container {

    width: 94%;

    margin-top: 30px;

    padding:
      25px
      12px
      50px;
  }

  #camera {

    height: auto;

    aspect-ratio:
      4 / 3;
  }

  .polaroid {

    width: 280px;

    height: 440px;
  }

  .slot {

    width: 228px;

    height: 120px;

    left: 26px;
  }

  #slot0 {
    top: 26px;
  }

  #slot1 {
    top: 160px;
  }

  #slot2 {
    top: 294px;
  }

  .printer {

    width: 290px;

    height: 200px;
  }

  .printer-detail {

    width: 230px;

    left: 27px;
  }

  .paper-slot {

    width: 230px;

    left: 27px;
  }

  .printed-photo {

    width: 205px;

    height: 320px;
  }

}

</style>

</head>

<script>


/* =====================================
   CAMERA SETUP
===================================== */

const video =
  document.getElementById(
    'camera'
  );


const canvas =
  document.createElement(
    'canvas'
  );


canvas.width =
  400;

canvas.height =
  300;


const ctx =
  canvas.getContext(
    '2d'
  );


/* =====================================
   VARIABLES
===================================== */

let currentShot =
  0;


let isCapturing =
  false;


let cameraStream =
  null;


/* =====================================
   START CAMERA
===================================== */

navigator.mediaDevices
  .getUserMedia({
    video: true
  })

  .then(
    function(stream) {

      cameraStream =
        stream;

      video.srcObject =
        stream;

    }
  )

  .catch(
    function(error) {

      alert(
        "Unable to access your camera. " +
        "Please allow camera permissions " +
        "and try again."
      );

      console.error(
        error
      );

    }
  );


/* =====================================
   START CAPTURE
===================================== */

function startCapture() {


  if (
    isCapturing
  ) {

    return;

  }


  isCapturing =
    true;


  currentShot =
    0;


  /* Clear previous photos */

  for (
    let i = 0;
    i < 3;
    i++
  ) {

    document
      .getElementById(
        'slot' + i
      )
      .innerHTML =
      '';

  }


  /* Hide print section */

  document
    .getElementById(
      'printSection'
    )
    .style.display =
    'none';


  /* Hide buttons */

  document
    .getElementById(
      'takePhotoButton'
    )
    .style.display =
    'none';


  document
    .getElementById(
      'captureButton'
    )
    .style.display =
    'inline-block';


  captureNext();

}


/* =====================================
   COUNTDOWN
===================================== */

function captureNext() {


  let count =
    3;


  const countdown =
    document
      .getElementById(
        'countdown'
      );


  countdown.innerText =
    count;


  const interval =
    setInterval(
      function() {


        count--;


        if (
          count > 0
        ) {

          countdown.innerText =
            count;

        }


        else {


          countdown.innerText =
            '📸';


          clearInterval(
            interval
          );


          takePhoto();


        }


      },
      1000
    );

}


/* =====================================
   TAKE PHOTO
===================================== */

function takePhoto() {


  /*
    Mirror the captured photo
    to match the camera.
  */


  ctx.save();


  ctx.translate(
    canvas.width,
    0
  );


  ctx.scale(
    -1,
    1
  );


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.restore();


  saveShot();

}


/* =====================================
   SAVE PHOTO
===================================== */

function saveShot() {


  const shotCanvas =
    document.createElement(
      'canvas'
    );


  shotCanvas.width =
    260;


  shotCanvas.height =
    140;


  const shotCtx =
    shotCanvas.getContext(
      '2d'
    );


  shotCtx.drawImage(
    canvas,
    0,
    0,
    260,
    140
  );


  const slot =
    document
      .getElementById(
        'slot' +
        currentShot
      );


  slot.innerHTML =
    '';


  slot.appendChild(
    shotCanvas
  );


  currentShot++;


  /* More photos */

  if (
    currentShot < 3
  ) {


    setTimeout(
      captureNext,
      1000
    );


  }


  /* All photos complete */

  else {


    isCapturing =
      false;


    document
      .getElementById(
        'countdown'
      )
      .innerText =
      '✨ Done!';


    /*
      Change START CAPTURE
      into TAKE PHOTO.
    */


    document
      .getElementById(
        'captureButton'
      )
      .style.display =
      'none';


    document
      .getElementById(
        'takePhotoButton'
      )
      .style.display =
      'inline-block';


  }

}


/* =====================================
   START PRINTING
===================================== */

function startPrinting() {


  /*
    Hide Take Photo button.
  */


  document
    .getElementById(
      'takePhotoButton'
    )
    .style.display =
    'none';


  /*
    Show printing section.
  */


  const printSection =
    document
      .getElementById(
        'printSection'
      );


  printSection.style.display =
    'block';


  /*
    Create final photo
    before animation.
  */


  createFinalImage();


  /*
    Reset printer.
  */


  const printer =
    document
      .getElementById(
        'printer'
      );


  const printedPhoto =
    document
      .getElementById(
        'printedPhoto'
      );


  printer.classList.remove(
    'printing'
  );


  printedPhoto.style.opacity =
    '0';


  /*
    Force browser
    to restart animation.
  */


  void printer.offsetWidth;


  /*
    Start animation.
  */


  printer.classList.add(
    'printing'
  );


  /*
    Printing message.
  */


  const message =
    document
      .getElementById(
        'printingMessage'
      );


  message.innerText =
    '🖨️ Printing your Santorini memory...';


  /*
    Wait for animation
    to finish.
  */


  setTimeout(
    function() {


      message.innerText =
        '✨ Your photo is ready!';


      document
        .getElementById(
          'saveButton'
        )
        .style.display =
        'inline-block';


      document
        .getElementById(
          'successMessage'
        )
        .style.display =
        'block';


    },
    5200
  );

}


/* =====================================
   CREATE FINAL IMAGE
===================================== */

function createFinalImage() {


  const strip =
    document.createElement(
      'canvas'
    );


  strip.width =
    320;


  strip.height =
    500;


  const sctx =
    strip.getContext(
      '2d'
    );


  const background =
    new Image();


  background.src =
    'polaroid.png';


  background.onload =
    function() {


      /*
        Draw Polaroid frame.
      */


      sctx.drawImage(
        background,
        0,
        0,
        320,
        500
      );


      /*
        Draw each photo.
      */


      for (
        let i = 0;
        i < 3;
        i++
      ) {


        const slot =
          document
            .getElementById(
              'slot' + i
            )
            .querySelector(
              'canvas'
            );


        if (
          slot
        ) {


          sctx.drawImage(
            slot,
            30,
            30 +
              (
                i * 150
              ),
            260,
            140
          );


        }


      }


      /*
        Convert final canvas
        into image.
      */


      const finalImage =
        document
          .getElementById(
            'printedImage'
          );


      finalImage.src =
        strip.toDataURL(
          'image/png'
        );


      /*
        Store final image
        for downloading.
      */


      window.finalPhoto =
        strip;


    };


}


/* =====================================
   DOWNLOAD FINAL PHOTO
===================================== */

function downloadPolaroid() {


  if (
    !window.finalPhoto
  ) {


    alert(
      'Please print your photo first.'
    );


    return;


  }


  const link =
    document.createElement(
      'a'
    );


  link.download =
    'oceanic-santorini-polaroid.png';


  link.href =
    window.finalPhoto
      .toDataURL(
        'image/png'
      );


  link.click();


}

@keyframes slideIn {

  }

  }

/* PAPER SLOT */

  width: 260px;

  background:

/* PRINTING PAPER */

.printed-photo {

.printer.printing

@keyframes printPhoto {

      translate(

/* PRINTING MESSAGE */

/* BOTTOM WAVE */

  }

}

<div class="main-container">

<script>


/* =====================================
   CAMERA SETUP
===================================== */

const video =
  document.getElementById(
    'camera'
  );


const canvas =
  document.createElement(
    'canvas'
  );


canvas.width =
  400;

canvas.height =
  300;


const ctx =
  canvas.getContext(
    '2d'
  );


/* =====================================
   VARIABLES
===================================== */

let currentShot =
  0;


let isCapturing =
  false;


let cameraStream =
  null;


/* =====================================
   START CAMERA
===================================== */

navigator.mediaDevices
  .getUserMedia({
    video: true
  })

  .then(
    function(stream) {

      cameraStream =
        stream;

      video.srcObject =
        stream;

    }
  )

  .catch(
    function(error) {

      alert(
        "Unable to access your camera. " +
        "Please allow camera permissions " +
        "and try again."
      );

      console.error(
        error
      );

    }
  );


/* =====================================
   START CAPTURE
===================================== */

function startCapture() {


  if (
    isCapturing
  ) {

    return;

  }


  isCapturing =
    true;


  currentShot =
    0;


  /* Clear previous photos */

  for (
    let i = 0;
    i < 3;
    i++
  ) {

    document
      .getElementById(
        'slot' + i
      )
      .innerHTML =
      '';

  }


  /* Hide print section */

  document
    .getElementById(
      'printSection'
    )
    .style.display =
    'none';


  /* Hide buttons */

  document
    .getElementById(
      'takePhotoButton'
    )
    .style.display =
    'none';


  document
    .getElementById(
      'captureButton'
    )
    .style.display =
    'inline-block';


  captureNext();

}


/* =====================================
   COUNTDOWN
===================================== */

function captureNext() {


  let count =
    3;


  const countdown =
    document
      .getElementById(
        'countdown'
      );


  countdown.innerText =
    count;


  const interval =
    setInterval(
      function() {


        count--;


        if (
          count > 0
        ) {

          countdown.innerText =
            count;

        }


        else {


          countdown.innerText =
            '📸';


          clearInterval(
            interval
          );


          takePhoto();


        }


      },
      1000
    );

}


/* =====================================
   TAKE PHOTO
===================================== */

function takePhoto() {


  /*
    Mirror the captured photo
    to match the camera.
  */


  ctx.save();


  ctx.translate(
    canvas.width,
    0
  );


  ctx.scale(
    -1,
    1
  );


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.restore();


  saveShot();

}


/* =====================================
   SAVE PHOTO
===================================== */

function saveShot() {


  const shotCanvas =
    document.createElement(
      'canvas'
    );


  shotCanvas.width =
    260;


  shotCanvas.height =
    140;


  const shotCtx =
    shotCanvas.getContext(
      '2d'
    );


  shotCtx.drawImage(
    canvas,
    0,
    0,
    260,
    140
  );


  const slot =
    document
      .getElementById(
        'slot' +
        currentShot
      );


  slot.innerHTML =
    '';


  slot.appendChild(
    shotCanvas
  );


  currentShot++;


  /* More photos */

  if (
    currentShot < 3
  ) {


    setTimeout(
      captureNext,
      1000
    );


  }


  /* All photos complete */

  else {


    isCapturing =
      false;


    document
      .getElementById(
        'countdown'
      )
      .innerText =
      '✨ Done!';


    /*
      Change START CAPTURE
      into TAKE PHOTO.
    */


    document
      .getElementById(
        'captureButton'
      )
      .style.display =
      'none';


    document
      .getElementById(
        'takePhotoButton'
      )
      .style.display =
      'inline-block';


  }

}


/* =====================================
   START PRINTING
===================================== */

function startPrinting() {


  /*
    Hide Take Photo button.
  */


  document
    .getElementById(
      'takePhotoButton'
    )
    .style.display =
    'none';


  /*
    Show printing section.
  */


  const printSection =
    document
      .getElementById(
        'printSection'
      );


  printSection.style.display =
    'block';


  /*
    Create final photo
    before animation.
  */


  createFinalImage();


  /*
    Reset printer.
  */


  const printer =
    document
      .getElementById(
        'printer'
      );


  const printedPhoto =
    document
      .getElementById(
        'printedPhoto'
      );


  printer.classList.remove(
    'printing'
  );


  printedPhoto.style.opacity =
    '0';


  /*
    Force browser
    to restart animation.
  */


  void printer.offsetWidth;


  /*
    Start animation.
  */


  printer.classList.add(
    'printing'
  );


  /*
    Printing message.
  */


  const message =
    document
      .getElementById(
        'printingMessage'
      );


  message.innerText =
    '🖨️ Printing your Santorini memory...';


  /*
    Wait for animation
    to finish.
  */


  setTimeout(
    function() {


      message.innerText =
        '✨ Your photo is ready!';


      document
        .getElementById(
          'saveButton'
        )
        .style.display =
        'inline-block';


      document
        .getElementById(
          'successMessage'
        )
        .style.display =
        'block';


    },
    5200
  );

}


/* =====================================
   CREATE FINAL IMAGE
===================================== */

function createFinalImage() {


  const strip =
    document.createElement(
      'canvas'
    );


  strip.width =
    320;


  strip.height =
    500;


  const sctx =
    strip.getContext(
      '2d'
    );


  const background =
    new Image();


  background.src =
    'polaroid.png';


  background.onload =
    function() {


      /*
        Draw Polaroid frame.
      */


      sctx.drawImage(
        background,
        0,
        0,
        320,
        500
      );


      /*
        Draw each photo.
      */


      for (
        let i = 0;
        i < 3;
        i++
      ) {


        const slot =
          document
            .getElementById(
              'slot' + i
            )
            .querySelector(
              'canvas'
            );


        if (
          slot
        ) {


          sctx.drawImage(
            slot,
            30,
            30 +
              (
                i * 150
              ),
            260,
            140
          );


        }


      }


      /*
        Convert final canvas
        into image.
      */


      const finalImage =
        document
          .getElementById(
            'printedImage'
          );


      finalImage.src =
        strip.toDataURL(
          'image/png'
        );


      /*
        Store final image
        for downloading.
      */


      window.finalPhoto =
        strip;


    };


}


/* =====================================
   DOWNLOAD FINAL PHOTO
===================================== */

function downloadPolaroid() {


  if (
    !window.finalPhoto
  ) {


    alert(
      'Please print your photo first.'
    );


    return;


  }


  const link =
    document.createElement(
      'a'
    );


  link.download =
    'oceanic-santorini-polaroid.png';


  link.href =
    window.finalPhoto
      .toDataURL(
        'image/png'
      );


  link.click();


}


/* =====================================
   GO HOME
===================================== */

function goHome() {


  window.location.href
