<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capture Your Polaroid</title>
  <style>
    body { background: linear-gradient(to bottom,#e0f7fa,#fff); font-family:'Georgia',serif; text-align:center; }
    header { background:#006699; color:#fff; padding:1.5em; font-size:2em; }
    #camera,#output { margin:20px auto; border:4px solid #99ccff; border-radius:12px; display:block; }
    #camera { transform:scaleX(-1); }
    button { background:#006699; color:#fff; border:none; padding:12px 24px; margin:10px; cursor:pointer; border-radius:8px; font-size:16px; }
    button:hover { background:#004466; }
    #countdown { font-size:3em; color:#006699; margin:10px; font-weight:bold; }
    .polaroid {
      margin:20px auto; width:320px; height:500px;
      border:10px solid #fff; background:#fff;
      box-shadow:0 4px 10px rgba(0,0,0,0.3);
      display:flex; flex-direction:column; justify-content:space-around; align-items:center;
    }
    .slot { width:260px; height:140px; border:2px dashed #ccc; margin:10px; }
    canvas { width:260px; height:140px; }
  </style>
</head>
<body>
  <header>📸 Capture Your Polaroid</header>
  <video id="camera" width="400" height="300" autoplay></video>
  <br>
  <button onclick="startCapture()">Start Capture</button>
  <div id="countdown"></div>

  <!-- Polaroid frame with slots -->
  <div class="polaroid" id="stripArea">
    <div class="slot" id="slot0"></div>
    <div class="slot" id="slot1"></div>
    <div class="slot" id="slot2"></div>
  </div>

  <script>
    const video=document.getElementById('camera');
    const canvas=document.createElement('canvas');
    canvas.width=400; canvas.height=300;
    const ctx=canvas.getContext('2d');
    let currentShot=0;

    navigator.mediaDevices.getUserMedia({video:true}).then(s=>video.srcObject=s);

    function startCapture(){
      currentShot=0;
      captureNext();
    }

    function captureNext(){
      let count=3;
      const cd=document.getElementById('countdown');
      cd.innerText=count;
      const interval=setInterval(()=>{
        count--;
        cd.innerText=count>0?count:'';
        if(count===0){
          ctx.drawImage(video,0,0,canvas.width,canvas.height);
          saveShot();
          clearInterval(interval);
        }
      },1000);
    }

    function saveShot(){
      const shotCanvas=document.createElement('canvas');
      shotCanvas.width=260; shotCanvas.height=140;
      const shotCtx=shotCanvas.getContext('2d');
      shotCtx.drawImage(canvas,0,0,shotCanvas.width,shotCanvas.height);
      document.getElementById('slot'+currentShot).innerHTML='';
      document.getElementById('slot'+currentShot).appendChild(shotCanvas);
      currentShot++;
      if(currentShot<3){ setTimeout(captureNext,1000); }
    }
  </script>
</body>
</html>
