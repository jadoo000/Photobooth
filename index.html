<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oceanic Photobooth</title>
<style>
  body {
    margin:0;
    font-family:'Georgia',serif;
    text-align:center;
    /* Background options */
    background: linear-gradient(to bottom, #004466, #0099cc); /* ocean gradient */
    background-attachment: fixed;
    /* If you want an image background, upload background.jpg and use: */
    /* background:url('background.jpg') no-repeat center/cover; */
  }
  header {
    background:rgba(0,0,0,0.5);
    color:#fff;
    padding:1.5em;
    font-size:2em;
  }
  h2 { margin-top:20px; color:#fff; }
  .preview {
    margin:30px auto; width:320px; height:500px;
    border:10px solid #fff; background:#fff;
    box-shadow:0 6px 12px rgba(0,0,0,0.3);
    cursor:pointer; transition:transform 0.3s, box-shadow 0.3s;
  }
  .preview:hover { transform:scale(1.05) rotate(-2deg); box-shadow:0 10px 20px rgba(0,0,0,0.4); }
  img { width:100%; height:100%; object-fit:cover; }
  .label { margin-top:10px; font-weight:bold; color:#fff; }
</style>
</head>
<body>
<header>🐬 Oceanic Photobooth</header>
<h2>Pick your look</h2>
<div class="preview" onclick="start()">
  <img src="polaroid.png" alt="3-Cut Polaroid">
</div>
<div class="label">3-Cut Strip</div>

<script>
  function start(){
    localStorage.setItem('chosenLayout','3');
    window.location.href="capture.html";
  }
</script>
</body>
</html>
