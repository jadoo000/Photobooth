<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oceanic Photobooth</title>
  <style>
    body {
      background: linear-gradient(to bottom, #e0f7fa, #ffffff);
      font-family: 'Georgia', serif;
      text-align: center;
    }
    header {
      background: #006699;
      color: white;
      padding: 1.5em;
      font-size: 1.5em;
      letter-spacing: 2px;
    }
    #camera, #output {
      margin: 20px auto;
      border: 4px solid #99ccff;
      border-radius: 12px;
      display: block;
    }
    #camera { transform: scaleX(-1); } /* Fix inverted camera */
    button {
      background: #006699;
      color: white;
      border: none;
      padding: 12px 24px;
      margin: 10px;
      cursor: pointer;
      border-radius: 8px;
      font-size: 16px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
    }
    button:hover { background: #004466; }
    footer { margin-top: 30px; font-size: 0.9em; color: #555; }
    #stripArea { margin-top: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>🌊 Oceanic Photobooth</h1>
    <p>Capture the sea of memories!</p>
  </header>

  <video id="camera" width="400" height="300" autoplay></video>
  <br>
  <button onclick="takePhoto()">📸 Take Photo</button>
  <button onclick="downloadPhoto()">⬇️ Download Photo</button>
  <button onclick="applyFilter('grayscale')">Grayscale</button>
  <button onclick="applyFilter('sepia')">Sepia</button>
  <button onclick="applyFilter('invert')">Invert</button>
  <button onclick="makeStrip(2)">2-Cut Strip</button>
  <button onclick="makeStrip(4)">4-Cut Strip</button>

  <canvas id="output" width="400" height="300"></canvas>
  <div id="stripArea"></div>

  <footer>
    <p>© 2026 Oceanic Photobooth Website</p>
  </footer>

  <script>
    const video = document.getElementById('camera');
    const canvas = document.getElementById('output');
    const context = canvas.getContext('2d');

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { alert("Camera access denied: " + err); });

    function takePhoto() {
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
    }

    function downloadPhoto() {
      const link = document.createElement('a');
      link.download = 'photobooth.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    function applyFilter(type) {
      const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {
        let r = data[i], g = data[i+1], b = data[i+2];
        if (type === 'grayscale') {
          let avg = (r+g+b)/3;
          data[i] = data[i+1] = data[i+2] = avg;
        } else if (type === 'sepia') {
          data[i] = r*0.393 + g*0.769 + b*0.189;
          data[i+1] = r*0.349 + g*0.686 + b*0.168;
          data[i+2] = r*0.272 + g*0.534 + b*0.131;
        } else if (type === 'invert') {
          data[i] = 255-r;
          data[i+1] = 255-g;
          data[i+2] = 255-b;
        }
      }
      context.putImageData(imageData, 0, 0);
    }

    function makeStrip(cuts) {
      const strip = document.createElement('canvas');
      strip.width = canvas.width;
      strip.height = canvas.height * cuts;
      const stripCtx = strip.getContext('2d');

      for (let i = 0; i < cuts; i++) {
        stripCtx.drawImage(canvas, 0, i*canvas.height, canvas.width, canvas.height);
      }

      // Show strip on page
      document.getElementById('stripArea').innerHTML = '';
      document.getElementById('stripArea').appendChild(strip);

      // Download strip
      const link = document.createElement('a');
      link.download = `photobooth_strip_${cuts}.png`;
      link.href = strip.toDataURL();
      link.click();
    }
  </script>
</body>
</html>
