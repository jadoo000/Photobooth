<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oceanic Photobooth</title>
  <style>
    /* Global design */
    body {
      background: linear-gradient(to bottom, #e0f7fa, #ffffff);
      font-family: 'Georgia', serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    header {
      background: #006699;
      color: white;
      padding: 1.5em;
      font-size: 2em;
      letter-spacing: 2px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    footer {
      margin-top: 30px;
      font-size: 0.9em;
      color: #555;
      padding: 1em;
    }

    /* Camera & canvas */
    #camera, #output {
      margin: 20px auto;
      border: 4px solid #99ccff;
      border-radius: 12px;
      display: block;
    }
    #camera { transform: scaleX(-1); } /* Fix inverted camera */

    /* Controls */
    .controls {
      margin: 15px;
    }
    button, select {
      background: #006699;
      color: white;
      border: none;
      padding: 12px 24px;
      margin: 8px;
      cursor: pointer;
      border-radius: 8px;
      font-size: 16px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
      transition: background 0.3s;
    }
    button:hover, select:hover { background: #004466; }

    /* Countdown */
    #countdown {
      font-size: 3em;
      color: #006699;
      margin: 10px;
      font-weight: bold;
    }

    /* Strip area */
    #stripArea {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>🐬 Oceanic Photobooth</header>

  <!-- Camera -->
  <video id="camera" width="400" height="300" autoplay></video>

  <!-- Controls -->
  <div class="controls">
    <select id="layoutSelect">
      <option value="single">Single Photo</option>
      <option value="2">2-Cut Strip</option>
      <option value="4">4-Cut Strip</option>
      <option value="grid">Grid (2x2)</option>
    </select>
    <button onclick="countdownCapture()">📸 Capture</button>
    <button onclick="downloadPhoto()">⬇️ Download</button>
    <button onclick="applyFilter('grayscale')">Grayscale</button>
    <button onclick="applyFilter('sepia')">Sepia</button>
    <button onclick="applyFilter('invert')">Invert</button>
  </div>

  <!-- Countdown -->
  <div id="countdown"></div>

  <!-- Canvas -->
  <canvas id="output" width="400" height="300"></canvas>

  <!-- Strip Area -->
  <div id="stripArea"></div>

  <footer>© 2026 Oceanic Photobooth</footer>

  <script>
    const video = document.getElementById('camera');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { alert("Camera access denied: " + err); });

    function countdownCapture() {
      let count = 3;
      const cd = document.getElementById('countdown');
      cd.innerText = count;
      const interval = setInterval(() => {
        count--;
        cd.innerText = count > 0 ? count : '';
        if (count === 0) {
          takePhoto();
          makeLayout();
          clearInterval(interval);
        }
      }, 1000);
    }

    function takePhoto() {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    }

    function downloadPhoto() {
      const link = document.createElement('a');
      link.download = 'photobooth.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    function applyFilter(type) {
      const d = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = d.data;
      for (let i = 0; i < data.length; i += 4) {
        let r = data[i], g = data[i+1], b = data[i+2];
        if (type === 'grayscale') {
          let avg = (r+g+b)/3;
          data[i] = data[i+1] = data[i+2] = avg;
        } else if (type === 'sepia') {
          data[i] = r*.393 + g*.769 + b*.189;
          data[i+1] = r*.349 + g*.686 + b*.168;
          data[i+2] = r*.272 + g*.534 + b*.131;
        } else if (type === 'invert') {
          data[i] = 255-r; data[i+1] = 255-g; data[i+2] = 255-b;
        }
      }
      ctx.putImageData(d, 0, 0);
    }

    function makeLayout() {
      const choice = document.getElementById('layoutSelect').value;
      const area = document.getElementById('stripArea');
      area.innerHTML = '';

      if (choice === 'single') {
        area.appendChild(canvas.cloneNode(true));
      } else if (choice === '2' || choice === '4') {
        const cuts = parseInt(choice);
        const strip = document.createElement('canvas');
        strip.width = canvas.width;
        strip.height = canvas.height * cuts;
        const sctx = strip.getContext('2d');
        for (let i = 0; i < cuts; i++) {
          sctx.drawImage(canvas, 0, i*canvas.height, canvas.width, canvas.height);
        }
        area.appendChild(strip);
      } else if (choice === 'grid') {
        const grid = document.createElement('canvas');
        grid.width = canvas.width * 2;
        grid.height = canvas.height * 2;
        const gctx = grid.getContext('2d');
        gctx.drawImage(canvas, 0, 0, canvas.width, canvas.height);
        gctx.drawImage(canvas, canvas.width, 0, canvas.width, canvas.height);
        gctx.drawImage(canvas, 0, canvas.height, canvas.width, canvas.height);
        gctx.drawImage(canvas, canvas.width, canvas.height, canvas.width, canvas.height);
        area.appendChild(grid);
      }
    }
  </script>
</body>
</html>
