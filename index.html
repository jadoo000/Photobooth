<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oceanic Photobooth</title>
  <style>
    body { background: linear-gradient(to bottom,#e0f7fa,#fff); font-family:'Georgia',serif; text-align:center; }
    header { background:#006699; color:#fff; padding:1.5em; font-size:2em; }
    .polaroid {
      margin:20px auto; width:320px; height:500px;
      border:10px solid #fff; background:#fff;
      box-shadow:0 4px 10px rgba(0,0,0,0.3);
      cursor:pointer; transition:transform 0.3s;
    }
    .polaroid:hover { transform:scale(1.05); }
    img { width:100%; height:100%; object-fit:cover; }
  </style>
</head>
<body>
  <header>🐬 Oceanic Photobooth</header>
  <h2>Click the Polaroid to Start</h2>
  <div class="polaroid" onclick="start()">
    <!-- Replace with your uploaded design file path -->
    <img src="your-polaroid-design.jpg" alt="Polaroid Design">
  </div>

  <script>
    function start(){
      localStorage.setItem('chosenLayout','3'); // fixed 3-cut strip
      window.location.href="capture.html";
    }
  </script>
</body>
</html>
